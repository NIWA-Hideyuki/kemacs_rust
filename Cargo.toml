[package]
name = "kemacs"
version = "0.1.0-rust"
edition = "2021"
description = "Rust port of kemacs (Japanese MicroEMACS 3.8i) - core implementation"
license = "SEE LICENSE IN LICENSE"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"

[profile.release]
opt-level = 2
